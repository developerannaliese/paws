# Copy to .github/workflows/paws.yml
# Then make "Paws" a required status check in your branch rules.
name: Paws

on:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  paws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so Paws can read every commit in the PR
      - uses: your-org/paws@v0   # or a local path: ./tools/paws
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paws-evidence
          path: paws-evidence.json
