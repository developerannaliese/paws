name: PawsOff
description: Checks pull requests for AI-written changes to protected files and confirms the human approvals your policy requires.
branding:
  icon: shield
  color: blue
inputs:
  report-only:
    description: Report problems without failing the check
    default: "false"
  github-token:
    description: Token used to read pull request reviews
    default: ${{ github.token }}
  evidence-file:
    description: Where to write the evidence record
    default: pawsoff-evidence.json
runs:
  using: composite
  steps:
    - name: Check AI changes against .pawsoff.yml
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PAWSOFF_REPORT_ONLY: ${{ inputs.report-only }}
        PAWSOFF_EVIDENCE: ${{ inputs.evidence-file }}
      run: |
        args=(pr-check --evidence "$PAWSOFF_EVIDENCE")
        if [ "$PAWSOFF_REPORT_ONLY" = "true" ]; then args+=(--report-only); fi
        node "${{ github.action_path }}/bin/pawsoff.js" "${args[@]}"
